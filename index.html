<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - Administración de Tierras Fiscales INRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #064E3B 0%, #0B1E16 65%, #022c22 100%);
      padding: 24px;
      font-family: var(--font-family);
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .login-header {
      background: #0B1E16;
      color: #FFFFFF;
      padding: 32px 24px 28px 24px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .login-logo {
      width: 52px;
      height: 52px;
      background: #064E3B;
      color: #FFFFFF;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0 auto 16px auto;
      border: 1px solid rgba(16, 185, 129, 0.3);
      box-shadow: 0 4px 12px rgba(6, 78, 59, 0.4);
    }
    .login-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .login-subtitle {
      font-size: 0.75rem;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
      font-weight: 600;
    }
    .login-body {
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .config-box {
      background: #F8FAFC;
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid #E2E8F0;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">INRA</div>
      <h1 class="login-title">INRA BOLIVIA</h1>
      <div class="login-subtitle">Dirección de Administración de Tierras Fiscales</div>
    </div>

    <div class="login-body">
      <!-- CONFIGURACIÓN DE SUPABASE — Solo visible si es necesario cambiarla -->
      <div class="config-box" id="config-box" style="display: none;">
        <div style="font-weight: 700; font-size: 0.85rem; color: #0F172A; margin-bottom: 10px;">
          Configuración de Servidor (Avanzado)
        </div>
        <div class="form-group mb-2">
          <label class="form-label" style="font-size: 0.7rem;">Project URL</label>
          <input type="text" id="cfg-url" class="form-control" style="font-size: 0.8rem;" placeholder="https://xyz.supabase.co">
        </div>
        <div class="form-group mb-2">
          <label class="form-label" style="font-size: 0.7rem;">Anon Key</label>
          <input type="password" id="cfg-key" class="form-control" style="font-size: 0.8rem;" placeholder="eyJhbGciOi...">
        </div>
        <button type="button" id="btn-save-cfg" class="btn btn-secondary btn-sm" style="width: 100%;">
          Guardar Conexión
        </button>
      </div>

      <!-- INICIO DE SESIÓN -->
      <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="font-weight: 700; font-size: 0.88rem; color: #1E293B;">
          Autenticación de Funcionario
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" placeholder="usuario@inra.gob.bo" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-submit-login" class="btn btn-primary" style="padding: 12px; font-size: 0.95rem; font-weight: 600; margin-top: 6px;">
          Ingresar al Sistema
        </button>

        <div style="text-align: center; margin-top: 2px;">
          <button type="button" id="btn-show-cfg" style="background:none; border:none; cursor:pointer; color: #64748B; font-size: 0.75rem; text-decoration: underline;">
            Ajustes avanzados de conexión
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- SUPABASE JS OFICIAL Y BUNDLE DE LA APLICACIÓN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app-bundle.js"></script>

  <script>
    // Pre-llenar config si hay algo guardado (para cuando se muestre el panel avanzado)
    const cfg = INRA.getSupabaseConfig();
    if (cfg.url) document.getElementById('cfg-url').value = cfg.url;
    if (cfg.key) document.getElementById('cfg-key').value = cfg.key;

    // Toggle panel de configuración avanzada
    document.getElementById('btn-show-cfg').addEventListener('click', function() {
      const box = document.getElementById('config-box');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('btn-save-cfg').addEventListener('click', function() {
      const u = document.getElementById('cfg-url').value.trim();
      const k = document.getElementById('cfg-key').value.trim();
      if (!u || !k) {
        INRA.showToast('Por favor ingrese ambos datos de Supabase', 'warning');
        return;
      }
      INRA.setSupabaseConfig(u, k);
      INRA.showToast('Conexión guardada con éxito', 'success');
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit-login');

      // Si el usuario escribió credenciales personalizadas, guardarlas primero
      const customUrl = document.getElementById('cfg-url').value.trim();
      const customKey = document.getElementById('cfg-key').value.trim();
      if (customUrl && customKey) {
        INRA.setSupabaseConfig(customUrl, customKey);
      }

      try {
        btn.disabled = true;
        btn.textContent = 'Verificando...';
        await INRA.login(email, pass);
        INRA.showToast('Acceso correcto. Bienvenido.', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Ingresar al Sistema';
        INRA.showToast('Error: ' + (err.message || 'Credenciales no válidas'), 'danger');
      }
    });
  </script>
</body>
</html>
